[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcribe"
version = "0.6.0"
description = "Fully local dictation and transcription for Apple Silicon Macs: press a global hotkey anywhere, speak, and on-device Whisper (MLX) types your words into the focused app — a free, private local tool that also ships as a Prime Agent skill."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gabriele Pizzi" }]
keywords = ["whisper", "dictation", "transcription", "prime-agent", "macos", "mlx", "local", "speech-to-text"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Linguistic",
]

# Apple Silicon Macs only: MLX is the one backend, turbo-q4 the one model.
# mlx-whisper-diet is our slim drop-in fork of mlx-whisper 0.4.3 (same mlx_whisper
# module): no torch/numba/scipy, ~750 MB less install. See NOTICE.
dependencies = [
    "mlx==0.32.1",
    "mlx-whisper-diet @ git+https://github.com/gbrlpzz/mlx-whisper-diet@f18a36a0af3a399cb23aa1cb2f7dfb28e0cf1f32",  # v0.4.3-diet1
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
transcribe = "transcribe.cli:main"

[tool.setuptools.packages.find]
include = ["transcribe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
