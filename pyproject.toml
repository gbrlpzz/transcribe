[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcribe"
version = "0.4.0"
description = "Fully local, native macOS dictation and transcription: press a global hotkey anywhere, speak, and on-device Whisper (MLX) types your words into the focused app — a free, private local tool that also ships as a Prime Agent skill."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gabriele Pizzi" }]
keywords = ["whisper", "dictation", "transcription", "prime-agent", "macos", "mlx", "local", "speech-to-text"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
mlx = ["mlx-whisper==0.4.3", "mlx==0.32.1"]
faster = ["faster-whisper>=1.0"]
all = ["mlx-whisper==0.4.3", "mlx==0.32.1", "faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
transcribe = "transcribe.cli:main"

[tool.setuptools.packages.find]
include = ["transcribe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
